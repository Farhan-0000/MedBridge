[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medbridge"
version = "3.0.0"
description = "MedBridge v3 - Clinical Guidance Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "psycopg2-binary",
    "qdrant-client>=1.9",
    "fastembed>=0.3",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "streamlit>=1.35",
    "pymupdf>=1.24",
    "structlog"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
